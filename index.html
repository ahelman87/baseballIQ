<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d1c">
<title>Baseball IQ — Where's the Play?</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
:root{
  --ink:#070d1c; --chalk:#f4f7f5; --dim:#93a2c4;
  --amber:#ffc24a; --amber-d:#e09b1c; --safe:#3ee07f; --out:#ff5a5f;
  --line:rgba(255,255,255,.10); --panel:rgba(255,255,255,.05);
  --o1:#3ba7ff; --o2:#ffc24a; --o3:#ff5fa8;
  --disp:"Arial Black","Helvetica Neue",Impact,system-ui,sans-serif;
  --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
body{font-family:var(--body);color:var(--chalk);background:var(--ink);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 42% at 12% -6%,rgba(255,214,140,.16),transparent 62%),
             radial-gradient(60% 42% at 88% -6%,rgba(255,214,140,.16),transparent 62%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}
 40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}
.shake{animation:shake .34s cubic-bezier(.36,.07,.19,.97)}

/* ═══════ START ═══════ */
#start{align-items:center;justify-content:center;overflow-y:auto;padding:22px 18px}
.hero{width:100%;max-width:520px;text-align:center;margin:auto 0}
.seam{width:70px;height:70px;margin:0 auto 12px;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-family:var(--disp);font-size:clamp(42px,12.5vw,78px);line-height:.84;letter-spacing:-.035em;
  margin:0 0 8px;text-transform:uppercase;
  background:linear-gradient(180deg,#fff 30%,#9fb4dd 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:var(--disp);font-size:clamp(16px,4.4vw,23px);letter-spacing:.14em;text-transform:uppercase;
  color:var(--amber);margin:0 0 16px}
.blurb{color:#cbd6ee;font-size:16px;line-height:1.6;max-width:380px;margin:0 auto 24px}
.picklab{font:800 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.pickgrp{margin-bottom:16px}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{padding:12px 5px;border-radius:14px;background:var(--panel);border:2px solid var(--line);transition:.16s}
.pick .ic{font-size:21px;line-height:1;margin-bottom:5px}
.pick b{display:block;font-size:14.5px;font-weight:800}
.pick i{display:block;font-style:normal;font-size:11px;color:var(--dim);margin-top:2px}
.pick.sel{background:rgba(255,194,74,.17);border-color:var(--amber)}
.pick.sel i{color:var(--amber)}
.pick:active{transform:scale(.95)}
.toggles{display:flex;gap:8px;margin-bottom:18px}
.tg{flex:1;padding:12px 8px;border-radius:14px;background:var(--panel);border:2px solid var(--line);
  font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
.tg.on{background:rgba(62,224,127,.14);border-color:var(--safe)}
.tg:active{transform:scale(.96)}
.play{width:100%;padding:20px;border-radius:18px;font-family:var(--disp);font-size:24px;letter-spacing:.08em;
  text-transform:uppercase;color:#2a1a00;background:linear-gradient(180deg,#ffd977,var(--amber-d));
  box-shadow:0 8px 0 #9d6a08,0 16px 34px rgba(255,180,40,.3);transition:.1s}
.play:active{transform:translateY(6px);box-shadow:0 2px 0 #9d6a08}
.play[disabled]{opacity:.55}
.career{margin-top:16px;font-size:12.5px;color:var(--dim)}

/* ═══════ SCOREBOARD ═══════ */
.board{flex:0 0 auto;display:flex;gap:8px;padding:8px 10px;align-items:stretch;
  background:linear-gradient(180deg,#111c38,#0a1226);border-bottom:1px solid var(--line);position:relative;z-index:5}
.team{flex:1;border-radius:14px;padding:7px 10px 8px;display:flex;align-items:center;gap:10px;min-width:0}
.team.me{background:rgba(62,224,127,.11);border:2px solid rgba(62,224,127,.33)}
.team.them{background:rgba(255,90,95,.11);border:2px solid rgba(255,90,95,.33)}
.team .big{font-family:var(--disp);font-size:clamp(26px,7.4vw,36px);line-height:.9;font-variant-numeric:tabular-nums}
.team.me .big{color:var(--safe)} .team.them .big{color:var(--out)}
.team .lab{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#b9c6e2;line-height:1.15}
.team .col{min-width:0;flex:1}
.pips{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.pip{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.14);transition:.3s}
.pip.f{background:var(--safe);box-shadow:0 0 7px rgba(62,224,127,.8)}
.flame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;font-size:19px;
  opacity:0;transition:.3s;pointer-events:none;filter:drop-shadow(0 0 10px rgba(255,140,20,.9))}
.flame.on{opacity:1}
.pop{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-family:var(--disp);font-size:19px;
  color:var(--amber);pointer-events:none;opacity:0;z-index:9}
@keyframes popup{0%{opacity:0;transform:translate(-50%,4px) scale(.7)}
 25%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}
.pop.go{animation:popup 1.1s ease-out}

/* ═══════ FIELD ═══════ */
.stage{flex:1;min-height:0;display:flex;flex-direction:column}
.fieldbox{position:relative;flex:1;min-height:0}
#field{position:absolute;left:0;top:60px;width:100%;height:calc(100% - 64px);display:block}
#field text{font-family:var(--body)}
#gFielders,#gRunners{pointer-events:none}
.hit-tgt{cursor:pointer}
.sitbar{position:absolute;left:0;right:0;top:0;height:60px;padding:7px 10px;pointer-events:none;overflow:hidden;
  background:linear-gradient(180deg,rgba(7,13,28,.9),rgba(7,13,28,0));display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px}
.outsrow{display:flex;align-items:center;gap:6px}
.ob{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.13);
  border:2px solid rgba(255,255,255,.22);position:relative}
.ob.f{background:#fbfbf7;border-color:#fff;box-shadow:0 0 9px rgba(255,255,255,.55)}
.ob.f::after{content:"";position:absolute;inset:2px 4px;border-left:1.5px solid #d4302f;border-right:1.5px solid #d4302f;
  border-radius:50%}
.outsrow em{font-style:normal;font:800 12px/1 var(--body);letter-spacing:.1em;color:var(--amber);margin-left:2px}
.sitbar b{font-size:clamp(14px,4.1vw,18px);font-weight:800;letter-spacing:.01em;text-align:center;
  text-shadow:0 2px 8px rgba(0,0,0,.7)}
.tagx{font:800 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#0b1226;
  background:var(--amber);padding:3px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}
.setup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  opacity:0;transition:opacity .28s;padding:20px}
.setup.on{opacity:1}
.setupcard{background:rgba(7,13,28,.9);border:2px solid var(--amber);border-radius:20px;padding:16px 22px;
  text-align:center;box-shadow:0 16px 50px rgba(0,0,0,.6);transform:scale(.92);transition:transform .28s}
.setup.on .setupcard{transform:scale(1)}
.setupcard .l{font:800 11px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.setupcard .t{font-family:var(--disp);font-size:clamp(19px,5.6vw,28px);text-transform:uppercase;line-height:1.05}
.setupcard .o{display:flex;gap:6px;justify-content:center;margin-top:11px;align-items:center}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:16px}
.callout{font-family:var(--disp);text-transform:uppercase;text-align:center;opacity:0;transform:scale(.3) rotate(-9deg)}
.callout.show{animation:stamp .5s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-9deg)}55%{opacity:1;transform:scale(.9) rotate(-9deg)}
 70%{transform:scale(1.06) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-9deg)}}
.callout .big{font-size:clamp(56px,18vw,116px);line-height:.82;color:#fff}
.callout .small{font-size:clamp(13px,3.6vw,18px);letter-spacing:.16em;margin-top:8px}
.callout.good .big{text-shadow:0 0 44px rgba(62,224,127,.9),0 6px 0 #1a8f4c}
.callout.bad .big{text-shadow:0 0 44px rgba(255,90,95,.9),0 6px 0 #a11e22}
.btns{position:absolute;top:8px;right:8px;z-index:20;display:flex;gap:6px}
.ib{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:16px;backdrop-filter:blur(6px)}
.ib.off{opacity:.4}

/* ═══════ CONTROLS ═══════ */
.controls{flex:0 0 auto;border-top:1px solid var(--line);background:linear-gradient(180deg,#0c142a,#070d1c);
  padding:9px 11px calc(11px + env(safe-area-inset-bottom));position:relative;z-index:6}
.clock{height:11px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-bottom:9px;display:none}
.clock.on{display:block}
.clock i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--safe),#a8ee5f);transform-origin:left}
.clock.warn i{background:linear-gradient(90deg,var(--amber),#ff9b3d)}
.clock.crit i{background:linear-gradient(90deg,var(--out),#ff9b3d);animation:pulse .45s infinite alternate}
@keyframes pulse{to{opacity:.4}}
.ask{font-size:clamp(16px,4.5vw,20px);font-weight:800;line-height:1.3;margin:0 0 10px;text-align:center}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:15px;background:var(--panel);
  border:2px solid var(--line);text-align:left;transition:.14s;min-height:56px}
.opt .num{flex:0 0 34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:19px;color:#08101f}
.opt .txt{font-size:16px;font-weight:750;line-height:1.2}
.opt:active{transform:scale(.975)}
.opt.right{background:rgba(62,224,127,.22);border-color:var(--safe)}
.opt.right.picked{border-color:#fff}  /* dual-answer scenarios: YOUR correct pick vs the also-fine one */
.opt.wrong{background:rgba(255,90,95,.22);border-color:var(--out)}
.opt .mk{margin-left:auto;font-size:20px;font-weight:900;opacity:0}
.opt.right .mk,.opt.wrong .mk{opacity:1}
.opt[disabled]{opacity:.4}
.opt.right[disabled],.opt.wrong[disabled]{opacity:1}
.opts.locked .opt{pointer-events:none}
.coach{display:none;animation:rise .3s ease-out}
.coach.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.coachbox{border-radius:15px;padding:12px 14px;background:rgba(255,194,74,.1);border:2px solid rgba(255,194,74,.4)}
.coachbox .hd{font-family:var(--disp);font-size:clamp(15px,4.3vw,19px);text-transform:uppercase;color:var(--amber);
  line-height:1.1;margin-bottom:6px}
.coachbox p{margin:0;font-size:15.5px;line-height:1.5;color:#e6ecfa}
.next{width:100%;margin-top:9px;padding:17px;border-radius:15px;font-family:var(--disp);font-size:19px;
  letter-spacing:.08em;text-transform:uppercase;color:#2a1a00;
  background:linear-gradient(180deg,#ffd977,var(--amber-d));box-shadow:0 5px 0 #9d6a08}
.next:active{transform:translateY(4px);box-shadow:0 1px 0 #9d6a08}

/* ═══════ RESULTS ═══════ */
#end{overflow-y:auto;padding:22px 18px calc(24px + env(safe-area-inset-bottom))}
.endwrap{width:100%;max-width:500px;margin:auto}
.medal{font-size:64px;text-align:center;line-height:1;margin-bottom:6px}
.rankv{font-family:var(--disp);font-size:clamp(30px,9vw,50px);line-height:.95;text-transform:uppercase;
  color:var(--amber);text-align:center}
.rankn{color:#cbd6ee;font-size:15.5px;line-height:1.5;text-align:center;margin:10px 0 20px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.tile{background:var(--panel);border:2px solid var(--line);border-radius:15px;padding:12px 6px;text-align:center}
.tile .i{font-size:20px;line-height:1}
.tile .n{font-family:var(--disp);font-size:26px;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.tile .l{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.bar{margin-bottom:12px}
.bartop{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:750;margin-bottom:5px}
.bartop .r{color:var(--dim);font-size:12.5px;font-weight:700}
.track{height:11px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.fill{display:block;width:100%;height:100%;border-radius:99px;transform-origin:left;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.9,.3,1)}
.note{font-size:15px;line-height:1.55;color:#e6ecfa;background:rgba(255,194,74,.1);border-radius:15px;
  padding:13px 14px;border:2px solid rgba(255,194,74,.35);margin:18px 0}
.ghost{width:100%;padding:15px;border-radius:15px;background:var(--panel);border:2px solid var(--line);
  font-weight:800;font-size:15px;margin-top:8px}

/* ═══════ WIDE ═══════ */
@media (min-width:840px) and (min-height:520px){
  .stage{flex-direction:row}
  .fieldbox{flex:1.3}
  .controls{flex:0 0 420px;border-top:0;border-left:1px solid var(--line);display:flex;flex-direction:column;
    justify-content:center;padding:24px}
  .ask{font-size:21px;margin-bottom:14px}
  .opt{min-height:64px} .opt .txt{font-size:17px}
  .team .big{font-size:38px}
}
@media (max-height:660px) and (max-width:839px){
  .opt{min-height:48px;padding:8px 11px} .opt .num{flex-basis:29px;height:29px;font-size:17px}
  .opt .txt{font-size:14.5px} .ask{font-size:15.5px;margin-bottom:7px}
  .board{padding:5px 8px} .team{padding:5px 8px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div id="app">

<!-- ══════ START ══════ -->
<section class="screen on" id="start">
  <div class="hero">
    <svg class="seam" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46" fill="#fbfbf7" stroke="#d8d8cd" stroke-width="2"/>
      <path d="M22 14 C40 34 40 66 22 86" fill="none" stroke="#d4302f" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M78 14 C60 34 60 66 78 86" fill="none" stroke="#d4302f" stroke-width="3.4" stroke-linecap="round"/>
      <g stroke="#d4302f" stroke-width="2.4" stroke-linecap="round">
        <path d="M27 25l7-3M29 36l8-2M30 48h8M29 60l8 2M27 75l7 3"/>
        <path d="M73 25l-7-3M71 36l-8-2M70 48h-8M71 60l-8 2M73 75l-7 3"/></g>
    </svg>
    <!-- Name is hardcoded here and in <title>. Phase 1 injects it at build time. -->
    <h1>Baseball<br>IQ</h1>
    <p class="sub">Where's the play?</p>
    <p class="blurb">The ball comes to you. Look at the runners. Count the outs. Then tap where you throw it.</p>

    <div class="pickgrp">
      <div class="picklab">Pick your level</div>
      <div class="picks" id="pickDiff">
        <button class="pick sel" data-band="Rookie"><div class="ic">🧢</div><b>Rookie</b><i>ages 8 &amp; under</i></button>
        <button class="pick" data-band="Minors"><div class="ic">⭐</div><b>Minors</b><i>ages 9–10</i></button>
        <button class="pick" data-band="Majors"><div class="ic">🔥</div><b>Majors</b><i>ages 11–12</i></button>
      </div>
    </div>
    <div class="pickgrp">
      <div class="picklab">How long?</div>
      <div class="picks" id="pickLen">
        <button class="pick" data-o="6"><div class="ic">⚡</div><b>Short</b><i>6 outs</i></button>
        <button class="pick sel" data-o="9"><div class="ic">⚾</div><b>Normal</b><i>9 outs</i></button>
        <button class="pick" data-o="18"><div class="ic">🏟️</div><b>Long</b><i>18 outs</i></button>
      </div>
    </div>
    <div class="toggles">
      <button class="tg on" id="tgVoice"><span>🗣️</span><span id="tgVoiceT">Read it to me</span></button>
      <button class="tg" id="tgClock"><span>⏱️</span><span id="tgClockT">No clock</span></button>
    </div>
    <button class="play" id="btnPlay" disabled>Play Ball</button>
    <div class="career" id="career"></div>
  </div>
</section>

<!-- ══════ GAME ══════ -->
<section class="screen" id="game">
  <div class="board">
    <div class="team me">
      <div class="big" id="sOuts">0</div>
      <div class="col"><div class="lab">Outs you got</div><div class="pips" id="pips"></div></div>
    </div>
    <div class="flame" id="flame">🔥</div>
    <div class="team them">
      <div class="big" id="sRuns">0</div>
      <div class="col"><div class="lab">Runs they got</div></div>
    </div>
    <div class="pop" id="pop"></div>
  </div>

  <div class="stage">
    <div class="fieldbox" id="fieldbox">
      <div class="btns">
        <button class="ib" id="btnVoice" aria-label="Read aloud">🗣️</button>
        <button class="ib" id="btnMute" aria-label="Sound">🔊</button>
      </div>
      <svg id="field" viewBox="40 30 920 750" preserveAspectRatio="xMidYMid meet" aria-label="Baseball field">
        <defs>
          <radialGradient id="gTurf" cx="50%" cy="88%" r="86%">
            <stop offset="0%" stop-color="#3f9e52"/><stop offset="55%" stop-color="#2f8143"/>
            <stop offset="100%" stop-color="#1d5b2e"/>
          </radialGradient>
          <linearGradient id="gClay" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c07f52"/><stop offset="100%" stop-color="#9d5f3b"/>
          </linearGradient>
          <radialGradient id="gLights" cx="50%" cy="26%" r="62%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity=".16"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="gBall"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#cfd4d8"/></radialGradient>
          <clipPath id="clipFair"><path d="M500 700 L60 260 A622 622 0 0 1 940 260 Z"/></clipPath>
          <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="9"/>
          </filter>
          <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
            <feGaussianBlur stdDeviation="7" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <rect x="40" y="30" width="920" height="750" fill="#123a20"/>
        <!-- fair territory -->
        <g clip-path="url(#clipFair)">
          <path d="M500 700 L60 260 A622 622 0 0 1 940 260 Z" fill="url(#gTurf)"/>
          <g id="mow" opacity=".085" fill="#ffffff"></g>
          <path d="M500 700 m-575 0 a575 575 0 0 1 1150 0 Z" fill="none"/>
          <!-- warning track -->
          <path d="M500 700 m-622 0 a622 622 0 0 1 1244 0 Z" fill="none"/>
          <circle cx="500" cy="700" r="622" fill="none" stroke="#a9714b" stroke-width="46"/>
          <circle cx="500" cy="700" r="622" fill="none" stroke="#0d2a18" stroke-width="12"/>
          <circle cx="500" cy="700" r="616" fill="none" stroke="#ffc24a" stroke-width="3" opacity=".55"/>
        </g>
        <rect x="40" y="30" width="920" height="750" fill="url(#gLights)" pointer-events="none"/>

        <!-- infield dirt -->
        <path d="M500 700 L309 509 A270 270 0 0 1 691 509 Z" fill="url(#gClay)"/>
        <!-- infield grass -->
        <polygon points="500,684 604,580 500,476 396,580" fill="#37954b"/>
        <polygon points="500,684 604,580 500,476 396,580" fill="none" stroke="#2c7a3d" stroke-width="2"/>
        <!-- base paths -->

<script>
"use strict";
/* ═══════ STORAGE ═══════
   Real localStorage with an in-memory fallback. Safari Private Mode throws on
   setItem, and in sandboxed / storage-partitioned contexts merely TOUCHING
   window.localStorage throws — so the feature test itself is inside the try.
   This is a write-probe, not an existence check: `typeof localStorage` passes
   in Private Mode and then blows up on the first save. */
const Store=(function(){
  const mem=Object.create(null);
  let ls=null;
  try{const probe="__probe__";
    window.localStorage.setItem(probe,"1");
    window.localStorage.removeItem(probe);
    ls=window.localStorage;
  }catch(e){ls=null;}
  return {
    get(k){
      if(ls){try{const v=ls.getItem(k);if(v!==null)return v;}catch(e){}}
      return (k in mem)?mem[k]:null;
    },
    set(k,v){
      mem[k]=String(v);                                  // always mirror, so a mid-session
      if(ls){try{ls.setItem(k,String(v));}catch(e){}}    // quota throw still keeps the session right
    }
  };
})();
/* Frozen wire format. Deliberately carries NO product name — a rename must not
   orphan a kid's saved progress. Bump :v1 only if the {g,n,r} shape changes. */
const CAREER_KEY="career:v1";

/* ═══════ FIELD GEOMETRY (unchanged) ═══════ */
const P = {
  home:[500,700], first:[620,580], second:[500,460], third:[380,580], mound:[500,618],
  F1:[500,616], F2:[500,748], F3:[652,548], F4:[588,476], F5:[362,545],
  F6:[414,476], F7:[262,300], F8:[500,232], F9:[738,300]
};
const POS = {F1:1,F2:2,F3:3,F4:4,F5:5,F6:6,F7:7,F8:8,F9:9};
const POSNAME={F1:"P",F2:"C",F3:"1B",F4:"2B",F5:"3B",F6:"SS",F7:"LF",F8:"CF",F9:"RF"};
const NS="http://www.w3.org/2000/svg";
const $=s=>document.querySelector(s);
const el=(t,a={})=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};

/* ballZone: ball location relative to the FIELDER, facing home — the real
   baseball convention: a 2B's right is toward second, a 3B's right is toward
   the line, the shortstop's hole is to his RIGHT. Bird's-eye rule: facing
   south, your right hand points west; in y-down SVG that is right=(-fy,fx).
   The audit asserts these facts by name so the chirality can never silently
   flip again. */
function zoneOffset(you,zone){
  if(!zone||zone==="at")return [0,0];
  const [hx,hy]=P.home,[x,y]=P[you];
  let fx=hx-x,fy=hy-y;const L=Math.hypot(fx,fy)||1;fx/=L;fy/=L;
  const D=50;
  if(zone==="in")   return [ fx*D, fy*D];
  if(zone==="deep") return [-fx*D,-fy*D];
  if(zone==="right")return [-fy*D, fx*D];
  if(zone==="left") return [ fy*D,-fx*D];
  return [0,0];
}
/* Nearest bag to a fielder's HOME position — deliberately not the displaced
   one, so ballZone can never move a tagbase target. */
function nearestBase(you){
  return ["first","second","third","home"].reduce((best,b)=>
    Math.hypot(P[you][0]-P[b][0],P[you][1]-P[b][1])<Math.hypot(P[you][0]-P[best][0],P[you][1]-P[best][1])?b:best);
}
/* Anchors are SEMANTIC, not incidental:
   - tagbase -> the nearest bag: the out happens at a base, so the marker,
     the ✓ HERE, and the celebration belong on it.
   - hold/tagrunner -> wherever the fielder currently IS (youAt): the action
     is at the fielder, and ballZone may have moved him. */
function anchorFor(key,you,youAt){
  const m={first:"first",second:"second",third:"third",home:"home",pitcher:"mound",
           cut2:"F4",cut6:"F6",cut3:"F3",cut5:"F5"};
  if(key==="tagbase") return P[nearestBase(you)];
  if(key==="hold"||key==="tagrunner") return youAt||P[you];
  return m[key]?P[m[key]]:null;
}
/* two label sets: throwing plays vs "where do you run" plays */
const L_THROW={first:"Throw to 1st",second:"Throw to 2nd",third:"Throw to 3rd",home:"Throw HOME",
  pitcher:"Give it to the pitcher",tagbase:"Step on the bag",tagrunner:"Chase him and tag him",
  hold:"Just hold the ball",cut2:"Throw to the 2nd baseman",cut6:"Throw to the shortstop",
  cut3:"Throw to the 1st baseman",cut5:"Throw to the 3rd baseman"};

const label=(k,s)=>(s.labels&&s.labels[k])||((s.mode==="go"&&L_GO[k])?L_GO[k]:L_THROW[k])||k;
/* spoken version of each answer, for the read-aloud */
const SPEAK={first:"first base",second:"second base",third:"third base",home:"home plate",
  pitcher:"the pitcher",tagbase:"step on the bag",tagrunner:"tag the runner",hold:"hold the ball",
  cut2:"the second baseman",cut6:"the shortstop",cut3:"the first baseman",cut5:"the third baseman"};

/* ═══════ SCENARIOS — loaded from content/scenarios.json ═══════

   failure the button becomes the retry affordance — never a dead screen. */

/* ═══════ SOUND ═══════ */
const SFX={ctx:null,on:true,

   if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume();},
 tone(f,d,t="triangle",v=.16,sl=0){if(!this.on||!this.ctx)return;
   const c=this.ctx,n=c.currentTime,o=c.createOscillator(),g=c.createGain();
   o.type=t;o.frequency.setValueAtTime(f,n);
   if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),n+d);
   g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.012);
   g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g).connect(c.destination);o.start(n);o.stop(n+d+.05);},
 noise(d=.09,v=.22,hp=900){if(!this.on||!this.ctx)return;
   const c=this.ctx,n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),ch=b.getChannelData(0);
   for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.4);
   const s=c.createBufferSource();s.buffer=b;
   const f=c.createBiquadFilter();f.type="highpass";f.frequency.value=hp;
   const g=c.createGain();g.gain.value=v;s.connect(f).connect(g).connect(c.destination);s.start();},

 mitt(){this.noise(.07,.16,600);},
 good(){this.tone(660,.1,"triangle",.16);setTimeout(()=>this.tone(880,.14,"triangle",.16),85);
   setTimeout(()=>this.tone(1180,.2,"triangle",.13),175);},
 bad(){this.tone(200,.3,"sawtooth",.13,-110);},
 tick(){this.tone(1500,.035,"square",.06);},
 whoosh(){this.noise(.16,.1,400);},

/* ═══════ READ ALOUD ═══════ */
const VOICE={on:true,v:null,ready:!!window.speechSynthesis,
 pick(){if(!this.ready)return;const vs=speechSynthesis.getVoices();if(!vs.length)return;
   this.v=vs.find(v=>/^en-US/.test(v.lang)&&/samantha|zira|google us|aria|jenny/i.test(v.name))
        ||vs.find(v=>/^en-US/.test(v.lang))||vs.find(v=>/^en/.test(v.lang))||null;},

   try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
     if(this.v)u.voice=this.v;u.rate=rate;u.pitch=1.04;speechSynthesis.speak(u);}catch(e){}},

if(VOICE.ready){VOICE.pick();speechSynthesis.onvoiceschanged=()=>VOICE.pick();}
const plain=t=>t.replace(/1st/g,"first").replace(/2nd/g,"second").replace(/3rd/g,"third")
                .replace(/—/g,",").replace(/\s+/g," ").trim();

/* ═══════ PARTICLES ═══════ */
const gFx=$("#gFx");let parts=[];
function burst(x,y,{n=18,color="#fff",spd=210,life=.75,size=5,grav=340,spread=Math.PI*2,dir=-Math.PI/2}={}){
  for(let i=0;i<n;i++){const a=dir+(Math.random()-.5)*spread,v=spd*(.45+Math.random()*.9);
    const c=el("circle",{r:size*(.5+Math.random()*.8),fill:Array.isArray(color)?color[i%color.length]:color});
    gFx.appendChild(c);parts.push({e:c,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:life*(.6+Math.random()*.7),grav});}
}
function ring(x,y,color="#fff",r0=8,r1=90,dur=.5,w=5){
  const c=el("circle",{cx:x,cy:y,r:r0,fill:"none",stroke:color,"stroke-width":w});
  gFx.appendChild(c);parts.push({e:c,ring:true,x,y,r0,r1,t:0,life:dur,w});
}
function stepParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;const k=p.t/p.life;
    if(k>=1){p.e.remove();parts.splice(i,1);continue;}
    if(p.ring){p.e.setAttribute("r",p.r0+(p.r1-p.r0)*(1-Math.pow(1-k,2.4)));
      p.e.setAttribute("opacity",(1-k).toFixed(3));p.e.setAttribute("stroke-width",(p.w*(1-k*.7)).toFixed(2));}
    else{p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      p.e.setAttribute("cx",p.x.toFixed(1));p.e.setAttribute("cy",p.y.toFixed(1));
      p.e.setAttribute("opacity",(1-k*k).toFixed(3));}}
}

/* ═══════ FIELD DRAWING ═══════ */
(function mow(){const g=$("#mow");
  for(let r=300;r<640;r+=46)g.appendChild(el("circle",{cx:500,cy:700,r:r,fill:"none",stroke:"#fff","stroke-width":23}));})();
(function baseLabels(){ // chalk names so "throw to 2nd" maps to a real bag
  const g=el("g",{opacity:".7"});
  [["1st",676,616],["2nd",500,420],["3rd",324,616],["HOME",596,732]].forEach(([t,x,y])=>{
    const n=el("text",{x,y,"text-anchor":"middle","font-size":19,"font-weight":"800",fill:"#fff",
      stroke:"rgba(0,0,0,.45)","stroke-width":3,"paint-order":"stroke"});
    n.textContent=t;g.appendChild(n);});
  $("#bases").after(g);})();

const gF=$("#gFielders"),gR=$("#gRunners"),gT=$("#gTargets"),gTrail=$("#gTrail");
const gBall=$("#gBall"),ballBody=$("#ballBody"),ballShadow=$("#ballShadow");

function drawFielders(you){
  gF.textContent="";
  for(const k in POS){
    const [x,y]=P[k],me=k===you;
    const g=el("g",{transform:`translate(${x},${y})`,opacity:me?1:.82});
    if(me){g.setAttribute("id","youF");  /* slideYou() moves this group on "go" plays */
      const h=el("circle",{r:26,fill:"none",stroke:"#ffc24a","stroke-width":4});
      h.appendChild(el("animate",{attributeName:"r",values:"23;32;23",dur:"1.5s",repeatCount:"indefinite"}));
      g.appendChild(h);}
    g.appendChild(el("circle",{r:15,fill:me?"#ffc24a":"#e9edf7",stroke:me?"#8a5a00":"#4a5b80","stroke-width":2}));
    const t=el("text",{y:5,"text-anchor":"middle","font-size":15,"font-weight":"800",fill:me?"#3a2400":"#1a2440"});
    t.textContent=POS[k];g.appendChild(t);
    if(me){const lb=el("text",{y:-36,"text-anchor":"middle","font-size":18,"font-weight":"800",fill:"#ffc24a",
      stroke:"rgba(0,0,0,.5)","stroke-width":3.5,"paint-order":"stroke"});lb.textContent="YOU";g.appendChild(lb);}
    gF.appendChild(g);
  }

let runnerEls=[];
function drawRunners(r){
  gR.textContent="";runnerEls=[];
  const bases=[P.first,P.second,P.third],nexts=[P.second,P.third,P.home];
  r.forEach((on,i)=>{if(!on)return;
    const g=el("g",{transform:`translate(${bases[i][0]},${bases[i][1]})`});
    g.appendChild(el("circle",{r:20,fill:"#d4302f","fill-opacity":".25"}));
    g.appendChild(el("circle",{r:13,fill:"#e8433f",stroke:"#7d1b19","stroke-width":2}));
    gR.appendChild(g);runnerEls.push({g,from:bases[i],to:nexts[i],idx:i});});
  /* batterRuns:false — some plays have NO batter-runner (steals, infield fly,
     dropped third strike with first occupied): drawing one puts a phantom red
     dot on screen running to a base nobody is running to. Default true. */
  if(G.cur&&G.cur.batterRuns===false)return;
  const b=el("g",{transform:`translate(${P.home[0]},${P.home[1]})`,opacity:0});
  b.appendChild(el("circle",{r:20,fill:"#d4302f","fill-opacity":".25"}));
  b.appendChild(el("circle",{r:13,fill:"#e8433f",stroke:"#7d1b19","stroke-width":2}));

/* breaks?: [1st,2nd,3rd] — per-runner go/hold. When absent, behavior is
   byte-identical to the single-style original (proven by driving both
   implementations against identical mocks — see the renderer session).
   The batter-runner is not in the array and always takes the global style. */
function moveRunners(k,style){
  const br=G.cur&&G.cur.breaks;
  runnerEls.forEach(r=>{
    const st=(!r.batter&&br)?(br[r.idx]?"go":"hold"):style;
    let f=st==="hold"?Math.sin(k*Math.PI)*.13:k*(r.batter?.62:.66);
    if(r.batter&&st==="hold")f=k*.3;
    const x=r.from[0]+(r.to[0]-r.from[0])*f,y=r.from[1]+(r.to[1]-r.from[1])*f;
    r.g.setAttribute("transform",`translate(${x.toFixed(1)},${y.toFixed(1)})`);
    if(r.batter)r.g.setAttribute("opacity",Math.min(1,k*4).toFixed(2));});

/* numbered + colour-matched targets.
   Badge offsets are hand-placed so a number never lands on a fielder or a chalk label. */
const BADGE={first:[-30,30],second:[0,42],third:[30,30],home:[-56,12],pitcher:[0,44],
  cut2:[26,-34],cut6:[-26,-34],cut3:[30,-29],cut5:[-30,-29]};
const BADGEF={F1:[0,44],F2:[56,14],F3:[30,-29],F4:[26,-34],F5:[-30,-29],
  F6:[-26,-34],F7:[-19,-37],F8:[0,-42],F9:[19,-37]};
function drawTargets(opts,s,onPick){
  gT.textContent="";

       hold/tagrunner ride the fielder and keep his BADGEF offset. */
    const off=k==="tagbase"?(BADGE[nearestBase(s.you)]||[0,42]):
      (k==="hold"||k==="tagrunner")?BADGEF[s.you]:(BADGE[k]||[0,42]);

    const g=el("g",{class:"hit-tgt"});

    g.appendChild(el("circle",{cx:a[0],cy:a[1],r:30,fill:col,"fill-opacity":".18",stroke:col,"stroke-width":4,...dash}));
    const p=el("circle",{cx:a[0],cy:a[1],r:30,fill:"none",stroke:col,"stroke-width":3,...dash});
    p.appendChild(el("animate",{attributeName:"r",values:"30;46;30",dur:"1.9s",repeatCount:"indefinite"}));
    p.appendChild(el("animate",{attributeName:"opacity",values:".7;0;.7",dur:"1.9s",repeatCount:"indefinite"}));
    g.appendChild(p);
    g.appendChild(el("line",{x1:a[0],y1:a[1],x2:bx,y2:by,stroke:col,"stroke-width":3,opacity:.55}));
    g.appendChild(el("circle",{cx:bx,cy:by,r:18,fill:col,stroke:"#08101f","stroke-width":2.5}));
    const n=el("text",{x:bx,y:by+8,"text-anchor":"middle","font-size":23,"font-weight":"800",fill:"#08101f"});
    n.textContent=i+1;g.appendChild(n);
    g.appendChild(el("circle",{cx:bx,cy:by,r:26,fill:col,"fill-opacity":".001"}));
    g.addEventListener("click",e=>{e.stopPropagation();onPick(k);});
    gT.appendChild(g);
  });
}
const clearTargets=()=>gT.textContent="";

/* force arrows — the "who has to run" teaching aid */
function forceArrows(s){
  const out=[];
  const [a,b,c]=s.r;

  if(a) out.push([P.first,P.second]);

    const dx=t[0]-f[0],dy=t[1]-f[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;

    ln.appendChild(el("animate",{attributeName:"opacity",values:"0;.95",dur:".3s",begin:(i*.13)+"s",fill:"freeze"}));
    gFx.appendChild(ln);
    const ang=Math.atan2(dy,dx)*180/Math.PI;
    const hd=el("polygon",{points:"0,-11 20,0 0,11",fill:"#3ee07f",opacity:0,

/* ball flight */
let trailPts=[];
function setBall(x,y,gy){
  gBall.setAttribute("opacity",1);
  ballBody.setAttribute("transform",`translate(${x.toFixed(1)},${y.toFixed(1)})`);
  const h=Math.max(0,gy-y),sc=1+h/240;
  ballShadow.setAttribute("cx",x.toFixed(1));ballShadow.setAttribute("cy",gy.toFixed(1));
  ballShadow.setAttribute("rx",(9*sc).toFixed(1));ballShadow.setAttribute("ry",(4*sc).toFixed(1));
  ballShadow.setAttribute("opacity",(.36/Math.max(1,sc*.9)).toFixed(2));
}
function pushTrail(x,y){const c=el("circle",{cx:x,cy:y,r:7,fill:"#fff",opacity:.5});gTrail.appendChild(c);trailPts.push({e:c,t:0});}
function stepTrail(dt){for(let i=trailPts.length-1;i>=0;i--){const p=trailPts[i];p.t+=dt;const k=p.t/.34;
  if(k>=1){p.e.remove();trailPts.splice(i,1);continue;}
  p.e.setAttribute("opacity",(.45*(1-k)).toFixed(3));p.e.setAttribute("r",(7*(1-k*.75)).toFixed(1));}}
const clearTrail=()=>{trailPts.forEach(p=>p.e.remove());trailPts=[];};
function flyBall(from,to,dur,arc,done,runStyle){
  const t0=performance.now();
  (function frame(now){
    const k=Math.min(1,(now-t0)/(dur*1000));
    const x=from[0]+(to[0]-from[0])*k,gy=from[1]+(to[1]-from[1])*k,y=gy-arc*4*k*(1-k);
    setBall(x,y,gy);
    if(k<1&&k>.03)pushTrail(x,y);
    if(runStyle)moveRunners(k,runStyle);
    if(k<1)requestAnimationFrame(frame);else done&&done();
  })(t0);
}
/* A1.3: "where do YOU run" answers move the PLAYER, not the ball. Slides the
   player's marker (halo and YOU label ride along — same <g>) to the answer spot.
   The ball stays wherever it landed: the other fielder has it, you're covering. */
function slideYou(to,dur,done){
  const g=gF.querySelector("#youF");
  if(!g){done&&done();return;}
  /* Start from wherever the fielder currently stands (ballZone may have moved
     him), and keep G.youAt honest — it is the one source of truth for the
     fielder's position, updated by whatever moves him. */
  const m=(g.getAttribute("transform")||"").match(/translate\(([-\d.]+),([-\d.]+)\)/);
  const f=m?[+m[1],+m[2]]:P[G.cur.you],t0=performance.now();
  (function frame(now){
    const k=Math.min(1,(now-t0)/(dur*1000));
    g.setAttribute("transform",`translate(${(f[0]+(to[0]-f[0])*k).toFixed(1)},${(f[1]+(to[1]-f[1])*k).toFixed(1)})`);
    if(k<1)requestAnimationFrame(frame);else{G.youAt=to;done&&done();}
  })(t0);
}
let last=performance.now();
(function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;stepParts(dt);stepTrail(dt);requestAnimationFrame(loop);})(last);

/* ═══════ GAME ═══════ */
// Default band is Rookie — 26 scenarios strong since the ROOKIE_SPECS batch;
// a Normal game repeats nothing.
const G={band:"Rookie",target:9,useClock:false,deck:[],i:0,outs:0,runs:0,streak:0,best:0,
  pts:0,right:0,played:0,limit:18,byTag:{},cur:null,answered:false,tStart:0,tRaf:0,ticked:99,pos:[],
  youAt:null,ballAt:null};  /* single source of truth for fielder/ball position, per play */
/* Clock allowances SHIFT down a band — an 8U player needs more time than the
   old ages-8-to-10 Rookie allowance, not the same. */
const LIMITS={Rookie:26,Minors:22,Majors:18};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function buildDeck(band){
  /* A1.4: cycle within the band rather than escalating — a repeat is a better
     experience than an 8-year-old getting Majors scenarios at play 12 of a Long game. */
  const core=shuffle(BANK.filter(s=>s.band===band));
  /* Guards for future filters (position, concept): an empty core would spin the
     fill loop forever, and returning [] would crash nextPlay (G.i%0 is NaN).
     Never break for the player; be unmissable for whoever wrote the bad filter. */
  if(!core.length){console.error("buildDeck: empty filter for band "+band);return shuffle(BANK.slice());}
  let deck=core.slice();
  while(deck.length<G.target+6)deck=deck.concat(shuffle(core.slice()));
  if(core.length<2)return deck;  /* one scenario: repeats are unavoidable, skip repair */
  /* Repair pass: no scenario twice in a row, AND no position twice in a row
     (B6 rotation — the catcher kid sees the whole field, not one bag). Scans
     EVERY adjacency including the modulo wrap (nextPlay indexes G.deck[G.i%len])
     and swaps the offender forward; repeats until a full scan is clean.
     Converges in 1-2 passes; hard-capped so a pathological deck returns as-is. */
  const n=deck.length;
  for(let pass=0;pass<8;pass++){
    let dirty=false;
    for(let i=0;i<n;i++){
      const j=(i+1)%n,k=(j+1)%n;
      if(deck[i]===deck[j]||deck[i].you===deck[j].you){[deck[j],deck[k]]=[deck[k],deck[j]];dirty=true;}
    }
    if(!dirty)break;
  }
  return deck;
}
function balls(n,host,size){
  host.textContent="";
  for(let i=0;i<3;i++){const b=document.createElement("i");b.className="ob"+(i<n?" f":"");
    if(size){b.style.width=size;b.style.height=size;}host.appendChild(b);}
  const e=document.createElement("em");e.textContent=n===1?"1 OUT":n+" OUTS";host.appendChild(e);
}
function paintBoard(){
  $("#sOuts").textContent=G.outs;$("#sRuns").textContent=G.runs;
  $("#flame").classList.toggle("on",G.streak>=3);
  const p=$("#pips");
  if(p.children.length!==G.target){p.textContent="";
    for(let i=0;i<G.target;i++){const d=document.createElement("i");d.className="pip";p.appendChild(d);}}
  [...p.children].forEach((c,i)=>c.classList.toggle("f",i<G.outs));
}
function popPts(n){
  const e=$("#pop");e.textContent="+"+n;e.classList.remove("go");void e.offsetWidth;e.classList.add("go");
}
/* clock */
function startClock(){
  if(!G.useClock){$("#clock").classList.remove("on");return;}
  $("#clock").classList.add("on");
  G.tStart=performance.now();G.ticked=99;
  const bar=$("#clock"),fill=$("#clockFill");bar.classList.remove("warn","crit");
  cancelAnimationFrame(G.tRaf);
  (function f(now){
    if(G.answered)return;
    const left=G.limit-(now-G.tStart)/1000,k=Math.max(0,left/G.limit);
    fill.style.transform=`scaleX(${k})`;
    bar.classList.toggle("warn",k<=.45&&k>.2);bar.classList.toggle("crit",k<=.2);
    const sec=Math.ceil(left);
    if(sec<=3&&sec>0&&sec<G.ticked){G.ticked=sec;SFX.tick();}
    if(left<=0){answer(null);return;}
    G.tRaf=requestAnimationFrame(f);
  })(performance.now());
}
const stopClock=()=>{G.answered=true;cancelAnimationFrame(G.tRaf);};

function nextPlay(){
  const s=G.deck[G.i%G.deck.length];G.i++;G.cur=s;G.answered=false;
  G.pos.push(POSNAME[s.you]);  /* B6 rotation: surfaced on the results screen */
  G.youAt=P[s.you];G.ballAt=null;  /* reset position state each play */
  clearTargets();clearTrail();gFx.textContent="";
  $("#coach").classList.remove("on");$("#opts").classList.remove("locked");
  $("#callout").classList.remove("show","good","bad");
  $("#clockFill").style.transform="scaleX(1)";$("#clock").classList.remove("warn","crit","on");
  $("#opts").textContent="";$("#ask").textContent="Watch the ball…";
  gBall.setAttribute("opacity",0);
  drawFielders(s.you);drawRunners(s.r);
  paintBoard();

  const sitFull=s.sit+(s.extra?`<span class="tagx">${s.extra}</span>`:"");
  $("#sitTxt").innerHTML=sitFull;
  balls(s.outs,$("#sitOuts"));
  // big "look at the field" beat first
  $("#setupTxt").textContent=s.sit+(s.extra?" · "+s.extra:"");
  balls(s.outs,$("#setupOuts"));
  $("#setup").classList.add("on");
  VOICE.say(plain(s.sit)+(s.extra?", "+s.extra:"")+", "+(s.outs===1?"one out":s.outs+" outs"));

  setTimeout(()=>{
    $("#setup").classList.remove("on");
    setTimeout(()=>{
      SFX.crack();
      /* Where the ball lands: another fielder (ballTo), offset from the player
         (ballZone), or right at the player. G.ballAt is the one source of
         truth for the ball's position from here on. */
      const off=zoneOffset(s.you,s.ballZone);
      const dest=s.ballTo?P[s.ballTo]:[P[s.you][0]+off[0],P[s.you][1]+off[1]];
      G.ballAt=dest;
      const cfg={ground:{dur:.72,arc:14},bunt:{dur:.55,arc:6},line:{dur:.6,arc:26},
                 fly:{dur:1.15,arc:210},pop:{dur:1.1,arc:180}}[s.hit]||{dur:.8,arc:20};
      if(!s.ballTo&&(off[0]||off[1])){
        G.youAt=dest;                    /* anchor to the destination, not the animation */
        slideYou(dest,cfg.dur);          /* fielder moves to meet the ball, same clock as the flight */
      }
      const style=(s.hit==="fly"||s.hit==="pop")?"hold":"go";
      if(s.hit==="ground"||s.hit==="bunt")burst(P.home[0],P.home[1]-6,{n:7,color:"#c98a5c",spd:120,life:.4,size:3.5,grav:400});
      flyBall(P.home,dest,cfg.dur,cfg.arc,()=>{
        SFX.mitt();
        burst(dest[0],dest[1],{n:9,color:"#e6cba8",spd:110,life:.45,size:3.4,grav:380});
        ring(dest[0],dest[1],"rgba(255,255,255,.6)",10,52,.42,3);
        showQuestion(s);
      },style);
    },260);
  },1500);
}

function showQuestion(s){
  $("#ask").textContent=s.ask;
  const box=$("#opts");box.textContent="";
  const shown=shuffle(s.opts.slice());
  shown.forEach((k,i)=>{
    const b=document.createElement("button");b.className="opt";b.dataset.k=k;
    b.innerHTML=`<span class="num" style="background:${OPTC[i%3]}">${i+1}</span>
                 <span class="txt">${label(k,s)}</span><span class="mk"></span>`;
    b.addEventListener("click",()=>answer(k));
    box.appendChild(b);
  });

function answer(key){
  if(G.answered)return;
  stopClock();clearTargets();VOICE.stop();
  /* alsoOk: some plays have two defensible answers whose tiebreaker (score,
     inning, whose arm) lives outside the picture — both count as outs, and
     the coaching note ends with "ask your coach". Absent on 56 of 58+
     scenarios; behavior is identical when absent. */
  const s=G.cur,also=s.alsoOk||[],ok=key===s.ans||also.includes(key);
  const alsoPick=ok&&key!==s.ans;  /* picked the secondary correct answer */
  const elapsed=G.useClock?(performance.now()-G.tStart)/1000:G.limit*.5;
  G.played++;G.byTag[s.tag]=G.byTag[s.tag]||{r:0,n:0};G.byTag[s.tag].n++;
  $("#opts").classList.add("locked");
  [...$("#opts").children].forEach(b=>{
    b.disabled=true;
    const mk=b.querySelector(".mk");
    if(b.dataset.k===s.ans||also.includes(b.dataset.k)){
      /* BOTH correct options show ✓ — if only the picked one did, the screen
         would contradict a note that says both work. The player's own pick is
         highlighted (white border), gated so nothing changes without alsoOk. */
      b.classList.add("right");mk.textContent="✓";
      if(also.length&&b.dataset.k===key)b.classList.add("picked");
    }
    else if(b.dataset.k===key){b.classList.add("wrong");mk.textContent="✗";}
  });
  /* Celebrate the PLAYER'S choice; a miss still replays the primary answer. */
  const toKey=ok?key:s.ans;
  const from=G.ballAt||P[s.you],to=anchorFor(toKey,s.you,G.youAt)||from;  /* throws come from where the ball IS */
  const co=$("#callout"),big=co.querySelector(".big"),small=co.querySelector(".small");

  if(ok){
    G.right++;G.streak++;G.best=Math.max(G.best,G.streak);G.byTag[s.tag].r++;G.outs++;
    const speed=G.useClock?Math.max(0,Math.round(120*(1-elapsed/G.limit))):60;
    const gained=Math.round((150+speed)*Math.min(3,1+(G.streak-1)*.25));
    G.pts+=gained;
    /* A1.3: on "where do YOU run" plays nothing is thrown — the PLAYER moves.
       A ball flying to the answer would teach the wrong lesson. Branches key
       off toKey (the player's choice) so an alsoOk pick animates as itself. */
    const isThrow=s.mode!=="go"&&!["tagbase","hold","tagrunner"].includes(toKey);
    const fire=()=>{
      SFX.good();
      burst(to[0],to[1],{n:26,color:["#3ee07f","#ffc24a","#fff","#7ce8ff"],spd:280,life:.9,size:6,grav:420});
      ring(to[0],to[1],"#3ee07f",12,120,.6,6);
      big.textContent="OUT!";small.textContent=alsoPick?"ALSO GOOD":(G.streak>=3?G.streak+" IN A ROW!":"NICE PLAY");
      co.classList.add("show","good");
      $("#fieldbox").classList.add("shake");setTimeout(()=>$("#fieldbox").classList.remove("shake"),340);
      paintBoard();popPts(gained);
      VOICE.say("Out! "+plain(s.big),1.02);
      reveal(true);
    };
    if(isThrow){SFX.whoosh();flyBall(from,to,.42,Math.min(90,dist(from,to)/4),fire);}
    else if(s.mode==="go"){SFX.whoosh();slideYou(to,.5,fire);}  /* the ball stays put — YOU run */
    else if(toKey==="tagbase"){
      /* "Step on the bag" means the fielder WALKS to it — dust where the ball
         was fielded, then carry it to the base the marker now sits on. */
      burst(G.youAt[0],G.youAt[1],{n:10,color:"#e6cba8",spd:120,life:.5,size:4,grav:400});
      slideYou(to,.4,fire);
    }
    else{burst(G.youAt[0],G.youAt[1],{n:10,color:"#e6cba8",spd:120,life:.5,size:4,grav:400});fire();}  /* dust = the FIELDER's feet, wherever he stands */
  } else {
    G.streak=0;G.runs++;SFX.bad();
    big.textContent=key===null?"TOO SLOW":"SAFE!";
    small.textContent="THEY SCORE A RUN";
    co.classList.add("show","bad");
    $("#fieldbox").classList.add("shake");setTimeout(()=>$("#fieldbox").classList.remove("shake"),340);
    ring(P.home[0],P.home[1],"#ff5a5f",12,120,.7,6);
    paintBoard();
    VOICE.say("Safe. "+plain(s.big),1.0);
    setTimeout(()=>{
      co.classList.remove("show","bad");
      // green guide + slow replay of the right play
      if(s.ans==="tagbase"){
        /* replay the WALK to the bag, same picture as a correct answer — the
           wrong answer is the teaching moment, so it gets the clearer version */
        const you=G.youAt||P[s.you];
        const gd=el("line",{x1:you[0],y1:you[1],x2:to[0],y2:to[1],stroke:"#3ee07f",
          "stroke-width":6,"stroke-dasharray":"14 10",opacity:.9});
        gFx.appendChild(gd);
        slideYou(to,.9,()=>{
          ring(to[0],to[1],"#3ee07f",12,100,.6,6);
          burst(to[0],to[1],{n:12,color:"#3ee07f",spd:160,life:.6,size:4.5,grav:400});
          markRight(to,s);
        });
      } else if(["hold","tagrunner"].includes(s.ans)){
        ring(from[0],from[1],"#3ee07f",14,90,.8,6);
        burst(from[0],from[1],{n:12,color:"#3ee07f",spd:140,life:.7,size:4,grav:380});
        markRight(to,s);
      } else if(s.mode==="go"){
        /* replay the RUN, not a throw: guide from the player, slide the player, ball stays put */
        const you=G.youAt||P[s.you];
        const gd=el("line",{x1:you[0],y1:you[1],x2:to[0],y2:to[1],stroke:"#3ee07f",
          "stroke-width":6,"stroke-dasharray":"14 10",opacity:.9});
        gFx.appendChild(gd);
        slideYou(to,.9,()=>{
          ring(to[0],to[1],"#3ee07f",12,100,.6,6);
          burst(to[0],to[1],{n:12,color:"#3ee07f",spd:160,life:.6,size:4.5,grav:400});
          markRight(to,s);
        });
      } else {
        const gd=el("line",{x1:from[0],y1:from[1],x2:to[0],y2:to[1],stroke:"#3ee07f",
          "stroke-width":6,"stroke-dasharray":"14 10",opacity:.9});
        gFx.appendChild(gd);
        flyBall(from,to,.9,Math.min(80,dist(from,to)/5),()=>{
          ring(to[0],to[1],"#3ee07f",12,100,.6,6);
          burst(to[0],to[1],{n:12,color:"#3ee07f",spd:160,life:.6,size:4.5,grav:400});
          markRight(to,s);
        });
      }
      reveal(false);
    },950);
  }
}

  $("#tOuts").textContent=G.outs;$("#tRuns").textContent=G.runs;$("#tStreak").textContent=G.best;
  $("#posLine").textContent="You played: "+[...new Set(G.pos)].join(", ");
  const bars=$("#bars");bars.textContent="";
  const tags=Object.entries(G.byTag).sort((a,b)=>(a[1].r/a[1].n)-(b[1].r/b[1].n));
  tags.forEach(([t,v])=>{
    const p=v.r/v.n,face=p>=.99?"😃":p>=.5?"🙂":"😐";
    const w=document.createElement("div");w.className="bar";
    w.innerHTML=`<div class="bartop"><span>${face} ${t}</span><span class="r">${v.r} of ${v.n}</span></div>

  $("#tgClockT").textContent=G.useClock?"Clock on":"No clock";SFX.init();SFX.tone(660,.06,"triangle",.1);});
$("#btnMute").addEventListener("click",()=>{SFX.on=!SFX.on;
  $("#btnMute").textContent=SFX.on?"🔊":"🔇";$("#btnMute").classList.toggle("off",!SFX.on);
  if(SFX.on){SFX.init();SFX.tone(880,.08);}});
$("#btnVoice").addEventListener("click",()=>{VOICE.on=!VOICE.on;
  $("#btnVoice").classList.toggle("off",!VOICE.on);$("#tgVoice").classList.toggle("on",VOICE.on);
  $("#tgVoiceT").textContent=VOICE.on?"Read it to me":"Reading off";
  if(!VOICE.on)VOICE.stop();else if(G.cur)VOICE.say(plain(G.cur.ask));});

function startGame(){
  if(!BANK.length)return;  /* deck not loaded yet (or failed) — Play Ball handles retry */
  SFX.init();if(VOICE.ready)VOICE.pick();
  G.deck=buildDeck(G.band);G.i=0;G.outs=0;G.runs=0;G.streak=0;G.best=0;
  G.pts=0;G.right=0;G.played=0;G.byTag={};G.limit=LIMITS[G.band];G.pos=[];
  $("#pips").textContent="";
  show("game");paintBoard();nextPlay();
}
$("#btnPlay").addEventListener("click",()=>{if(!BANK.length){loadBank();return;}startGame();});
$("#btnAgain").addEventListener("click",startGame);
$("#btnHome").addEventListener("click",()=>{VOICE.stop();show("start");loadCareer();});
document.addEventListener("keydown",e=>{
  if($("#game").classList.contains("on")){
    const o=[...$("#opts").children];
    if(/^[1-3]$/.test(e.key)&&o[+e.key-1]&&!G.answered)o[+e.key-1].click();
    if((e.key===" "||e.key==="Enter")&&$("#coach").classList.contains("on")){e.preventDefault();$("#btnNext").click();}
  } else if($("#start").classList.contains("on")&&(e.key===" "||e.key==="Enter")){e.preventDefault();startGame();}
});
document.addEventListener("touchstart",()=>SFX.init(),{once:true,passive:true});
loadCareer();loadBank();
</script>
