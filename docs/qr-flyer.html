<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baseball IQ — printable half-sheet</title>
<style>
  /* Half-sheet: two of these per portrait Letter page. Print at 100%, no scaling. */
  @page { size: 5.5in 8.5in; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 5.5in; height: 8.5in;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #000; background: #fff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 0.45in 0.4in;
  }
  h1 {
    font-family: "Arial Black", Impact, sans-serif;
    font-size: 46pt; line-height: .85; letter-spacing: -.02em;
    text-transform: uppercase; margin: 0 0 6pt;
  }
  .sub {
    font-family: "Arial Black", Impact, sans-serif;
    font-size: 15pt; letter-spacing: .12em; text-transform: uppercase;
    margin: 0 0 14pt;
  }
  .blurb { font-size: 12.5pt; line-height: 1.45; max-width: 3.9in; margin: 0 0 16pt; }
  /* Pure black on white, no halftone — QR codes scan badly through grey. */
  img { width: 3.1in; height: 3.1in; display: block; image-rendering: pixelated; }
  .url {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13pt; font-weight: bold; margin-top: 14pt; letter-spacing: .01em;
  }
  .foot { font-size: 10pt; margin-top: 5pt; }
</style>
</head>
<body>
  <h1>Baseball<br>IQ</h1>
  <p class="sub">Where's the play?</p>
  <p class="blurb">The ball comes to you. Look at the runners. Count the outs. Then tap where you throw it.</p>
  <img src="qr.png" alt="QR code to baseball-iq.vercel.app">
  <p class="url">baseball-iq.vercel.app</p>
  <p class="foot">Free. No app to download. Works without wifi.</p>
</body>
</html>
